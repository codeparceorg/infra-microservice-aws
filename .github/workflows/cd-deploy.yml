name: Terraform Deploy

on:
  push:
    branches: [ "dev","test" ]


permissions:
  contents: read
  id-token: write

jobs:
  terraform-deploy:
    name: Deploy Terraform
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configurar credenciales AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_STATE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Env
        uses: codeparce/ci-workflows/.github/actions/github/env@v1
        with:
          env-file: .env

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init && Templeate config
        run: | 
         envsubst < provider.tf.template> provider.tf
         terraform init 

      - name: Deploy en aws
        run: terraform apply -auto-approve 