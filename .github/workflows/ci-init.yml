name: Terraform Init

on:
  pull_request:
    branches: [dev,test]


permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-init:
    name: Initialize Terraform
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref}}
      GITHUB_REPOSITORY_NAME: ${{ github.event.pull_request.base.repo.name}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configurar credenciales AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_STATE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get parameters
        uses: codeparce/ci-workflows/.github/actions/aws/parameters@v1
        with:
          path-parameter: /$GITHUB_REPOSITORY_NAME/$TARGET_BRANCH

      - name: Set env
        uses: codeparce/ci-workflows/.github/actions/github/env@v1
        with:
          env-file: .env

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init && Templeate config
        run: | 
         envsubst < provider.tf.template> provider.tf
         terraform init 

      - name: Realizar el Plan 
        run: terraform plan -out .planfile

      - name: Post PR comment
        uses: borchero/terraform-plan-comment@v2
        with:
          token: ${{ github.token }}
          planfile: .planfile