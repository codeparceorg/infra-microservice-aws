name: Terraform Init

on:
  pull_request:
    branches: [dev,test]


permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-init:
    name: Initialize Terraform
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref}}
      GITHUB_REPOSITORY: ${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Mostrar contexto del workflow
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Base branch: $TARGET_BRANCH"

      # - name: Inspeccionar claims OIDC
      #   shell: bash
      #   run: |
      #     set -euo pipefail

      #     RESPONSE=$(curl -sS \
      #       -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #       "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

      #     export OIDC_TOKEN
      #     OIDC_TOKEN=$(printf '%s' "$RESPONSE" | jq -er '.value')

      #     node -e '
      #       const token = process.env.OIDC_TOKEN;
      #       const claims = JSON.parse(
      #         Buffer.from(token.split(".")[1], "base64url").toString()
      #       );
      #       console.log(JSON.stringify({
      #         aud: claims.aud,
      #         sub: claims.sub,
      #         repository: claims.repository,
      #         repository_id: claims.repository_id,
      #         repository_owner_id: claims.repository_owner_id,
      #         ref: claims.ref,
      #         event_name: claims.event_name
      #       }, null, 2));
      #     '

      #     unset OIDC_TOKEN RESPONSE


      - name: Configurar credenciales AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_STATE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Templeate config
        shell: bash
        run: |
          envsubst < provider.tf.template> provider.tf

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar backend remoto
        run: terraform init 

      - name: Realizar el Plan 
        run: terraform plan -out .planfile

      - name: Subir plan al bucket
        run: aws s3 cp .planfile s3://codeparce/devsu/plans/$GITHUB_REPOSITORY-$TARGET_BRANCH.planfile

      - name: Post PR comment
        uses: borchero/terraform-plan-comment@v2
        with:
          token: ${{ github.token }}
          planfile: .planfile