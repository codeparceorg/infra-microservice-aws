name: Terraform Init

on:
  pull_request:
    branches: [dev,test]


permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-init:
    name: Initialize Terraform
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Mostrar contexto del workflow
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Base branch: $TARGET_BRANCH"

      - name: Configurar credenciales AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_STATE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Templeate config
        shell: bash
        run: |
          envsubst < provider.tf.template> provider.tf

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar backend remoto
        run: terraform init 

      - name: Realizar el Plan 
        run: terraform plan -out .planfile

      - name: Post PR comment
        uses: borchero/terraform-plan-comment@v2
        with:
          token: ${{ github.token }}
          planfile: .planfile